<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hero reel preview</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/hero-reel.css">
  <style>
    body { background: var(--off-white); }
    .pv-head { padding: 72px var(--gap) 40px; max-width: 1100px; }
    .pv-head h1 { font-weight: 400; font-size: clamp(44px, 6.4vw, 96px); line-height: 1; letter-spacing: -.035em; margin: 0; }
    .pv-head p { max-width: 36em; margin: 24px 0 0; font-size: clamp(16px, 1.3vw, 20px); color: #555; }
    .pv-reel { margin: 0 var(--gap); }
    .pv-after { height: 120vh; }
    @media (min-width: 1200px) { .pv-head { padding-left: calc(var(--gap) * 2 + 240px); } .pv-reel { margin: 0 calc(var(--gap) * 2); } }
  </style>
</head>
<body>
  <!-- Same files as the homepage (assets/hero-reel.css + .js); scroll down to see the hold -->
  <div class="pv-head">
    <h1>Sites que fazem negócios crescer</h1>
    <p>O seu site não devia apenas estar online — devia trabalhar por si. Transformo sites para atrair mais visitas, gerar mais contactos e apoiar a próxima fase do seu negócio.</p>
  </div>
  <div class="pv-reel hero-visual hero-reel js-hero-reel" aria-hidden="true"></div>
  <div class="pv-after"></div>
  <script src="assets/hero-reel.js"></script>
</body>
</html>
